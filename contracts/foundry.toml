[profile.default]
src = "src"
out = "out"
script = "script"
libs = ["lib", "node_modules"]
cache_path = "forge-cache"
solc = "0.8.28"
optimizer = true
optimizer_runs = 1
via_ir = true
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.network"
